<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>恶魔低语 · 首版画面对照</title>
  <style>
    @font-face{font-family:Pixel;src:url(pixel.ttf)}
    *{box-sizing:border-box}body{margin:0;padding:34px 36px 30px;background:#090b0d;color:#dce5e4;font-family:'PingFang SC',sans-serif}
    header{display:flex;justify-content:space-between;align-items:center;padding-bottom:25px;border-bottom:1px solid #263746;margin-bottom:25px}
    h1{font-weight:400;font-size:24px;letter-spacing:3px;margin:0}header span{color:#7c91a5;font:9px Pixel,monospace;letter-spacing:1px}
    main{display:grid;grid-template-columns:repeat(2,327px);justify-content:space-between;gap:34px}
    figure{margin:0}figcaption{display:flex;justify-content:space-between;font-size:11px;color:#9bb1c4;letter-spacing:1px;margin-bottom:13px}figcaption span{font:8px Pixel,monospace;color:#657e96}
    img{display:block;width:327px;height:760px;border:1px solid #25333c}footer{font-size:10px;color:#7a8e9c;letter-spacing:.6px;margin-top:22px;display:flex;justify-content:space-between}a{color:#9fbad3;text-decoration:none}
  </style>
</head>
<body>
  <header><h1>恶魔低语</h1><span>PHOSPHOR WIREFRAME / V.01</span></header>
  <main>
    <figure><figcaption>待机 · 荧光蓝声场<span>01 / READY</span></figcaption><img src="ready.png" alt="待机状态的三维蓝色声场与线框界面"></figure>
    <figure><figcaption>录音 · 斜视声场<span>02 / LISTEN</span></figcaption><img src="listen.png" alt="录音时波形起伏，文字附着在三维声场上"></figure>
  </main>
  <footer><span>代码实渲 · 三维几何 + 清晰线芯 + 双尺度辉光</span><a href="/">打开交互原型 ↗</a></footer>
</body>
</html>
